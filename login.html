<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk | PMB Nusantara</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-sm">
    <!-- Login Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
      <!-- Brand Logo -->
      <div class="text-center mb-6">
        <div class="w-14 h-14 rounded-2xl bg-brand-700 text-white flex items-center justify-center text-2xl mx-auto mb-3 shadow-sm">
          <i class="bi bi-mortarboard-fill"></i>
        </div>
        <h1 class="text-lg font-bold text-slate-900">PMB Nusantara</h1>
        <p class="text-xs text-slate-500 mt-0.5">Sistem Informasi Pendaftaran Mahasiswa Baru</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="user">Akun pengguna</label>
            <input
              class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors"
              type="text"
              id="user"
              placeholder="Masukkan nama akun"
              autocomplete="username"
              required
            >
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="pass">Kata sandi</label>
            <input
              class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors"
              type="password"
              id="pass"
              placeholder="Masukkan kata sandi"
              autocomplete="current-password"
              required
            >
          </div>
        </div>

        <p class="text-xs text-slate-400 mt-4 mb-5">Formulir ini hanya contoh tampilan prototipe, belum terhubung ke autentikasi.</p>

        <button type="submit" class="w-full py-2.5 bg-brand-700 hover:bg-brand-800 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors mb-2">
          Masuk ke Dashboard
        </button>
        <a href="index.html" class="block text-center w-full py-2 border border-slate-300 hover:border-slate-400 text-slate-700 text-sm font-medium rounded-lg transition-colors">
          Lihat dashboard tanpa login
        </a>
      </form>
    </div>

    <footer class="text-center text-xs text-slate-400 mt-6">
      Kemas Faris Rahadiansyah (103022300040)
    </footer>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
